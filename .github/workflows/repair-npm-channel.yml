name: Repair bootstrap npm channel

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          scope: '@aruniverse'
      - run: pnpm install --frozen-lockfile
      - name: Run the tested channel verifier without republishing
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PRERELEASE: 'true'
          NPM_TAG: next
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            import { spawnSync } from "node:child_process";
            import YAML from "yaml";
            const workflow = YAML.parse(readFileSync(".github/workflows/release.yml", "utf8"));
            const step = workflow.jobs.release.steps.find(step => step.name === "Verify npm channel");
            const result = spawnSync("bash", ["-e", "-o", "pipefail", "-c", step.run], { stdio: "inherit" });
            process.exit(result.status ?? 1);
          '
