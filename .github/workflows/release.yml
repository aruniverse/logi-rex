name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          scope: '@aruniverse'
      - run: pnpm install --frozen-lockfile
      - name: Classify version tag
        id: release
        run: |
          tag="$GITHUB_REF_NAME"
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            tag="v$(node -p "require('./package.json').version")"
          fi
          node scripts/release-info.mjs "$tag" --github-output "$GITHUB_OUTPUT"
      - run: pnpm test
        if: github.event_name == 'push'
      - run: pnpm run verify:artifacts
        if: github.event_name == 'push'
      - name: Create checksums for verified archives
        if: github.event_name == 'push'
        run: shasum -a 256 aruniverse-logi-rex-*.tgz > SHA256SUMS
      - name: Publish GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
        run: |
          case "$PRERELEASE" in
            true) flags=(--prerelease --latest=false) ;;
            false) flags=(--latest) ;;
            *) echo "Invalid prerelease output; refusing to publish." >&2; exit 1 ;;
          esac
          gh release create "$GITHUB_REF_NAME" "${flags[@]}" \
            --verify-tag --title "logi-rex $GITHUB_REF_NAME" --generate-notes \
            aruniverse-logi-rex-*.tgz SHA256SUMS
      - name: Publish public npm package
        if: github.event_name == 'push'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
          NPM_TAG: ${{ steps.release.outputs.npm_tag }}
        run: |
          case "$PRERELEASE:$NPM_TAG" in
            true:next|false:latest) ;;
            *) echo "Invalid release channel; refusing to publish." >&2; exit 1 ;;
          esac
          pnpm publish aruniverse-logi-rex-*.tgz --registry https://registry.npmjs.org --access public --provenance --publish-wait-timeout 120000 --ignore-scripts --no-git-checks --tag "$NPM_TAG"
      - name: Verify npm channel
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
          NPM_TAG: ${{ steps.release.outputs.npm_tag }}
        run: |
          case "$PRERELEASE:$NPM_TAG" in
            true:next|false:latest) ;;
            *) echo "Invalid release channel; refusing to alter tags." >&2; exit 1 ;;
          esac
          package="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          test "$(pnpm view "$package" "dist-tags.$NPM_TAG" --registry https://registry.npmjs.org)" = "$version"
          if [ "$PRERELEASE" = true ]; then
            latest="$(pnpm view "$package" dist-tags.latest --registry https://registry.npmjs.org)"
            if [ "$latest" = "$version" ]; then
              # pnpm protects latest from removal; use npm's registry administration command.
              pnpm dlx npm@11.21.1 dist-tag rm "$package" latest --registry https://registry.npmjs.org
            fi
          fi
